[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minitopol"
version = "0.1.0"
description = "Streaming molecular trajectory registry and descriptor storage"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.11", "MDAnalysis>=2.10,<3", "zarr>=3.1.3,<4", "numcodecs>=0.16.3,<0.18", "pyarrow>=18", "duckdb>=1.2,<2", "filelock>=3.16"]

[project.optional-dependencies]
test = ["pytest>=8", "mdtraj>=1.11,<2", "mcp>=1.10,<2"]
mcp = ["mcp>=1.10,<2"]
acceleration = ["numba>=0.68,<0.69"]
gpu = ["numba>=0.68,<0.69", "nvidia-cuda-nvcc-cu12==12.9.86", "nvidia-cuda-runtime-cu12==12.9.79"]
parallel = ["psutil>=6"]
lossless = ["pcodec==1.0.4", "zarr>=3.4.1,<4", "numcodecs>=0.17,<0.18"]

[project.scripts]
minitopol = "minitopol.cli:main"
minitopol-mcp = "minitopol.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minitopol = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
