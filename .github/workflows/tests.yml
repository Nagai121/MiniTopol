name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Zarr >=3.4.1 (required by the lossless extra) needs Python >=3.12.
      - name: Install test and acceleration dependencies (Python 3.11)
        if: matrix.python == '3.11'
        run: python -m pip install -e ".[test,acceleration,parallel]"
      - name: Install lossless dependencies (Python 3.12)
        if: matrix.python == '3.12'
        run: python -m pip install -e ".[test,acceleration,lossless,parallel]"
      - run: python -m pytest -q
